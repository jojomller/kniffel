<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kniffel – Festwert eintragen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Gochi+Hand&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0}
.t-wax{--paper:#F2F2F0;--paper2:#E8E8E5;--line:#D9D9D5;--line2:#BDBDB8;--ink:#2A2A28;--ink2:#4A4A47;--ink3:#666662;--pen:#CF2A18;--scrim:rgba(42,42,40,.45)}
.t-pen{--paper:#FBF7E6;--paper2:#F2EBD1;--line:#E4DBBD;--line2:#CDBF97;--ink:#25272D;--ink2:#464851;--ink3:#5E605F;--pen:#1F3FA6;--scrim:rgba(37,39,45,.42)}
.t-pencil{--paper:#FBF6EE;--paper2:#F3EADB;--line:#E8DCC8;--line2:#D3C2A6;--ink:#3A322A;--ink2:#5C5246;--ink3:#6B6155;--pen:#E06A18;--scrim:rgba(58,50,42,.38)}
.ui{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink)}
.wax{font-family:'Gochi Hand','Bradley Hand',cursive;font-weight:400;color:var(--pen);font-size-adjust:cap-height .64;padding:.1em .16em;margin:-.1em -.16em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.t-wax .wax{background-image:radial-gradient(circle at 30% 35%,rgba(242,242,240,.5) 0 .45px,transparent .8px),radial-gradient(circle at 70% 65%,rgba(255,170,150,.45) 0 .7px,transparent 1.1px),linear-gradient(172deg,#E2402A,#CC2412 55%,#B11A0B);background-size:4px 4px,7px 6px,100% 100%;-webkit-text-stroke:.03em #C8210F;filter:drop-shadow(0 0 .6px rgba(200,33,15,.5))}
.t-pen .wax{font-family:'Caveat',cursive;font-weight:600;background-image:repeating-linear-gradient(100deg,transparent 0 3px,rgba(251,247,230,.22) 3px 4px),linear-gradient(180deg,#2A4BBE,#17348E)}
.t-pencil .wax{font-family:'Patrick Hand',cursive;background-image:repeating-linear-gradient(-55deg,rgba(251,246,238,.55) 0 .7px,transparent .7px 2.4px),radial-gradient(circle at 40% 40%,rgba(251,246,238,.6) 0 .5px,transparent .9px),linear-gradient(#F0832F,#E06A18 60%,#D85F10);background-size:auto,3px 3px,100% 100%;-webkit-text-stroke:.015em rgba(232,112,30,.5)}
.hs{fill:none;stroke:var(--pen);stroke-linecap:round;stroke-linejoin:round}
.t-wax .hs{filter:drop-shadow(0 0 .6px rgba(200,33,15,.6))}
.t-pen .hs{stroke-width:2px}
.t-pencil .hs{opacity:.85;stroke-dasharray:14 1.5}
.ic{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
</style>
</helmet>
<div class="ui {{th}}" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden">

  <div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;display:flex;flex-direction:column">
    <div style="display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:48px 6px 0 6px">
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="1.7"><path d="M4 20h16M7 20v-6M12 20V6M17 20v-9"></path></svg></span>
      <div style="display:flex;flex-direction:column;align-items:center"><span class="wax" style="font-size:30px;line-height:1;transform:rotate(-2deg)">kniffel</span><span class="cap" style="font-size:10px">Zug 9 / 26</span></div>
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" class="ic" stroke-width="1.6"><path d="M14.1 4.4a1.6 1.6 0 0 1 2.2 0l3.3 3.3a1.6 1.6 0 0 1 0 2.2L11 18.5H7.2l-3-3a1.6 1.6 0 0 1 0-2.2z"></path><path d="M8.6 9.9l5.5 5.5"></path><path d="M11 18.5h9"></path></svg></span>
    </div>
    <div style="display:grid;grid-template-columns:140px repeat(2,minmax(0,1fr));height:58px;border-bottom:1.5px solid var(--line2);margin-top:4px">
      <span style="border-right:1px solid var(--line)"></span>
      <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper2);border-right:1px solid var(--line)"><span class="wax" style="font-size:26px;line-height:1">JoJo</span><svg width="36" height="7" viewBox="0 0 40 7"><path class="hs" d="M3 4.5 C 13 1.5, 25 6, 37 2.5" stroke-width="2.8"></path></svg></span>
      <span style="display:flex;align-items:center;justify-content:center"><span class="wax" style="font-size:26px;line-height:1">Juli</span></span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <div style="display:grid;grid-template-columns:140px repeat(2,minmax(0,1fr));height:44px;border-bottom:1px solid var(--line)">
        <span style="display:flex;align-items:center;padding-left:16px;font-size:15px;font-weight:500;border-right:1px solid var(--line)">{{r.l}}</span>
        <span class="wax" style="display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--paper2);border-right:1px solid var(--line)">{{r.a}}</span>
        <span class="wax" style="display:flex;align-items:center;justify-content:center;font-size:28px">{{r.b}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;top:0;right:0;bottom:0;background:var(--scrim)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="tf" style="position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px 34px 20px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:center"><span style="width:38px;height:4px;border-radius:2px;background:var(--line2)"></span></div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span class="cap">JoJo · Zug 9</span>
        <h2 id="tf" style="margin:0;font-size:24px;font-weight:700">Full House</h2>
      </div>
      <a href="Main.dc.html" aria-label="Abbrechen" style="width:44px;height:44px;border-radius:22px;background:var(--paper2);display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" class="ic" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <sc-for list="{{dice}}" as="d" hint-placeholder-count="5">
        <span style="position:relative;display:inline-block;width:30px;height:30px;border:1.5px solid var(--ink2);border-radius:8px;box-sizing:border-box;flex:none">
          <sc-for list="{{d.pips}}" as="p" hint-placeholder-count="3"><span style="position:absolute;left:{{p.l}}px;top:{{p.t}}px;width:{{p.d}}px;height:{{p.d}}px;border-radius:50%;background:var(--ink2)"></span></sc-for>
        </span>
      </sc-for>
      <span style="font-size:14px;color:var(--ink2);padding-left:8px">3 gleiche + 2 gleiche</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <a href="Main.dc.html" style="text-decoration:none;height:132px;border-radius:18px;background:var(--paper2);box-shadow:inset 0 0 0 2px var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span class="wax" style="font-size:64px;line-height:.95">25</span>
        <span class="cap" style="color:var(--ink)">Eintragen</span>
      </a>
      <a href="Main.dc.html" style="text-decoration:none;height:132px;border:1.5px solid var(--line2);border-radius:18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
        <svg width="76" height="22" viewBox="0 0 76 22" aria-hidden="true"><path class="hs" d="M5 14 C 17 5, 28 19, 40 10 S 62 6, 71 11" stroke-width="4"></path></svg>
        <span class="cap" style="color:var(--ink)">Streichen · 0</span>
      </a>
    </div>
    <p style="margin:0;font-size:13px;line-height:1.45;color:var(--ink3)">Gleiches Muster für Kl. Straße (30), Gr. Straße (40) und Kniffel (50).</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stil":{"editor":"enum","options":["Grau · Wachs-Rot","Papier · Kuli-Blau","Beige · Buntstift-Orange"],"default":"Grau · Wachs-Rot"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pips(n, s, d) {
    const a = s * 0.27, m = s * 0.5, z = s * 0.73;
    const P = { tl: [a, a], tr: [z, a], ml: [a, m], c: [m, m], mr: [z, m], bl: [a, z], br: [z, z] };
    const map = { 1: ['c'], 2: ['tr', 'bl'], 3: ['tr', 'c', 'bl'], 4: ['tl', 'tr', 'bl', 'br'], 5: ['tl', 'tr', 'c', 'bl', 'br'], 6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br'] };
    return map[n].map((k) => ({ l: (P[k][0] - d / 2).toFixed(1), t: (P[k][1] - d / 2).toFixed(1), d }));
  }
  renderVals() {
    const s = this.props.stil ?? 'Grau · Wachs-Rot';
    return {
      th: s.indexOf('Kuli') >= 0 ? 't-pen' : (s.indexOf('Buntstift') >= 0 ? 't-pencil' : 't-wax'),
      dice: [5, 5, 5, 2, 2].map((n) => ({ pips: this.pips(n, 27, 4.6) })),
      rows: [
        { l: '1er', a: '3', b: '' }, { l: '2er', a: '', b: '6' }, { l: '3er', a: '', b: '' },
        { l: '4er', a: '12', b: '' }, { l: '5er', a: '', b: '20' }, { l: '6er', a: '18', b: '' },
        { l: 'Bonus', a: '', b: '' }, { l: 'Dreierpasch', a: '', b: '' }, { l: 'Viererpasch', a: '', b: '' }
      ]
    };
  }
}
</script>
</body>
</html>
