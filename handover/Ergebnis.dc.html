<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kniffel – Ergebnis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Gochi+Hand&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0}
.t-wax{--paper:#F2F2F0;--paper2:#E8E8E5;--line:#D9D9D5;--line2:#BDBDB8;--ink:#2A2A28;--ink2:#4A4A47;--ink3:#666662;--pen:#CF2A18;--scrim:rgba(42,42,40,.45)}
.t-pen{--paper:#FBF7E6;--paper2:#F2EBD1;--line:#E4DBBD;--line2:#CDBF97;--ink:#25272D;--ink2:#464851;--ink3:#5E605F;--pen:#1F3FA6;--scrim:rgba(37,39,45,.42)}
.t-pencil{--paper:#FBF6EE;--paper2:#F3EADB;--line:#E8DCC8;--line2:#D3C2A6;--ink:#3A322A;--ink2:#5C5246;--ink3:#6B6155;--pen:#E06A18;--scrim:rgba(58,50,42,.38)}
.ui{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink)}
.wax{font-family:'Gochi Hand','Bradley Hand',cursive;font-weight:400;color:var(--pen);font-size-adjust:cap-height .64;padding:.1em .16em;margin:-.1em -.16em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.t-wax .wax{background-image:radial-gradient(circle at 30% 35%,rgba(242,242,240,.5) 0 .45px,transparent .8px),radial-gradient(circle at 70% 65%,rgba(255,170,150,.45) 0 .7px,transparent 1.1px),linear-gradient(172deg,#E2402A,#CC2412 55%,#B11A0B);background-size:4px 4px,7px 6px,100% 100%;-webkit-text-stroke:.03em #C8210F;filter:drop-shadow(0 0 .6px rgba(200,33,15,.5))}
.t-pen .wax{font-family:'Caveat',cursive;font-weight:600;background-image:repeating-linear-gradient(100deg,transparent 0 3px,rgba(251,247,230,.22) 3px 4px),linear-gradient(180deg,#2A4BBE,#17348E)}
.t-pencil .wax{font-family:'Patrick Hand',cursive;background-image:repeating-linear-gradient(-55deg,rgba(251,246,238,.55) 0 .7px,transparent .7px 2.4px),radial-gradient(circle at 40% 40%,rgba(251,246,238,.6) 0 .5px,transparent .9px),linear-gradient(#F0832F,#E06A18 60%,#D85F10);background-size:auto,3px 3px,100% 100%;-webkit-text-stroke:.015em rgba(232,112,30,.5)}
.hs{fill:none;stroke:var(--pen);stroke-linecap:round;stroke-linejoin:round}
.t-wax .hs{filter:drop-shadow(0 0 .6px rgba(200,33,15,.6))}
.t-pen .hs{stroke-width:2px}
.t-pencil .hs{opacity:.85;stroke-dasharray:14 1.5}
.ic{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
</style>
</helmet>
<div class="ui {{th}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;justify-content:space-between;align-items:center;padding:48px 6px 0 6px">
    <a href="Statistik.dc.html" aria-label="Statistik öffnen" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px">
      <svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="1.7" aria-hidden="true"><path d="M4 20h16M7 20v-6M12 20V6M17 20v-9"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Schließen, zurück zum Block" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px">
      <svg width="18" height="18" viewBox="0 0 24 24" class="ic" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;padding:14px 24px 0 24px;gap:4px">
    <span class="cap">Spiel beendet · 26.10.2026</span>
    <span class="wax" style="font-size:80px;line-height:1;transform:rotate(-3deg);margin-top:10px">JoJo</span>
    <span class="cap" style="letter-spacing:.4em;color:var(--ink)">gewinnt</span>
    <div style="position:relative;width:230px;height:150px;display:flex;align-items:center;justify-content:center;margin-top:6px">
      <svg width="230" height="150" viewBox="0 0 230 150" aria-hidden="true" style="position:absolute;left:0;top:0"><path class="hs" d="M38 92 C 22 44, 82 14, 140 18 C 196 22, 222 64, 196 104 C 172 138, 92 142, 52 120 C 24 104, 22 66, 56 42" stroke-width="3.4"></path></svg>
      <span class="wax" style="font-size:104px;line-height:1;position:relative">268</span>
    </div>
  </div>

  <div style="padding:18px 20px 0 20px;display:flex;flex-direction:column">
    <sc-for list="{{ranks}}" as="r" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;gap:14px;min-height:68px;border-bottom:1px solid var(--line)">
        <span class="wax" style="font-size:28px;width:26px;line-height:1">{{r.rank}}</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px">
          <span class="wax" style="font-size:26px;line-height:1">{{r.name}}</span>
          <span style="font-size:13px;color:var(--ink3)">{{r.detail}}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <span class="wax" style="font-size:34px;line-height:1">{{r.total}}</span>
          <span style="font-size:12px;color:var(--ink3)">{{r.diff}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:auto;padding:0 20px 30px 20px;display:flex;flex-direction:column;gap:10px">
    <a href="Main.dc.html" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:16px;background:var(--ink);color:var(--paper)">
      <span style="font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Neues Spiel</span>
      <span style="font-size:12px;opacity:.8">Gleiche Namen · Juli beginnt</span>
    </a>
    <a href="Main.dc.html" style="text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1.5px solid var(--line2);box-sizing:border-box;font-size:15px;font-weight:600;color:var(--ink)">Block ansehen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stil":{"editor":"enum","options":["Grau · Wachs-Rot","Papier · Kuli-Blau","Beige · Buntstift-Orange"],"default":"Grau · Wachs-Rot"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.stil ?? 'Grau · Wachs-Rot';
    return {
      th: s.indexOf('Kuli') >= 0 ? 't-pen' : (s.indexOf('Buntstift') >= 0 ? 't-pencil' : 't-wax'),
      ranks: [
        { rank: '1', name: 'JoJo', detail: 'Oben 66 + Bonus 35 · Unten 167', total: '268', diff: 'Sieg' },
        { rank: '2', name: 'Juli', detail: 'Oben 58 · Unten 183', total: '241', diff: '−27' }
      ]
    };
  }
}
</script>
</body>
</html>
