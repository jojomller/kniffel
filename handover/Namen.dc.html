<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kniffel – Namen wählen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Gochi+Hand&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0}
.t-wax{--paper:#F2F2F0;--paper2:#E8E8E5;--line:#D9D9D5;--line2:#BDBDB8;--ink:#2A2A28;--ink2:#4A4A47;--ink3:#666662;--pen:#CF2A18;--scrim:rgba(42,42,40,.45)}
.t-pen{--paper:#FBF7E6;--paper2:#F2EBD1;--line:#E4DBBD;--line2:#CDBF97;--ink:#25272D;--ink2:#464851;--ink3:#5E605F;--pen:#1F3FA6;--scrim:rgba(37,39,45,.42)}
.t-pencil{--paper:#FBF6EE;--paper2:#F3EADB;--line:#E8DCC8;--line2:#D3C2A6;--ink:#3A322A;--ink2:#5C5246;--ink3:#6B6155;--pen:#E06A18;--scrim:rgba(58,50,42,.38)}
.ui{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink)}
.wax{font-family:'Gochi Hand','Bradley Hand',cursive;font-weight:400;color:var(--pen);font-size-adjust:cap-height .64;padding:.1em .16em;margin:-.1em -.16em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.t-wax .wax{background-image:radial-gradient(circle at 30% 35%,rgba(242,242,240,.5) 0 .45px,transparent .8px),radial-gradient(circle at 70% 65%,rgba(255,170,150,.45) 0 .7px,transparent 1.1px),linear-gradient(172deg,#E2402A,#CC2412 55%,#B11A0B);background-size:4px 4px,7px 6px,100% 100%;-webkit-text-stroke:.03em #C8210F;filter:drop-shadow(0 0 .6px rgba(200,33,15,.5))}
.t-pen .wax{font-family:'Caveat',cursive;font-weight:600;background-image:repeating-linear-gradient(100deg,transparent 0 3px,rgba(251,247,230,.22) 3px 4px),linear-gradient(180deg,#2A4BBE,#17348E)}
.t-pencil .wax{font-family:'Patrick Hand',cursive;background-image:repeating-linear-gradient(-55deg,rgba(251,246,238,.55) 0 .7px,transparent .7px 2.4px),radial-gradient(circle at 40% 40%,rgba(251,246,238,.6) 0 .5px,transparent .9px),linear-gradient(#F0832F,#E06A18 60%,#D85F10);background-size:auto,3px 3px,100% 100%;-webkit-text-stroke:.015em rgba(232,112,30,.5)}
.hs{fill:none;stroke:var(--pen);stroke-linecap:round;stroke-linejoin:round}
.t-wax .hs{filter:drop-shadow(0 0 .6px rgba(200,33,15,.6))}
.t-pen .hs{stroke-width:2px}
.t-pencil .hs{opacity:.85;stroke-dasharray:14 1.5}
.ic{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
input::placeholder{color:var(--ink3)}
</style>
</helmet>
<div class="ui {{th}}" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden">

  <div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;display:flex;flex-direction:column">
    <div style="display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:48px 6px 0 6px">
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="1.7"><path d="M4 20h16M7 20v-6M12 20V6M17 20v-9"></path></svg></span>
      <div style="display:flex;flex-direction:column;align-items:center"><span class="wax" style="font-size:30px;line-height:1;transform:rotate(-2deg)">kniffel</span><span class="cap" style="font-size:10px">Zug 1 / 39</span></div>
      <span style="display:flex;justify-content:flex-end"><span style="width:44px;height:44px;border-radius:22px;background:var(--paper);display:flex;align-items:center;justify-content:center;position:relative;z-index:2"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="1.8"><path d="M12 4.5v15M4.5 12h15"></path></svg></span><span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" class="ic" stroke-width="1.6"><path d="M14.1 4.4a1.6 1.6 0 0 1 2.2 0l3.3 3.3a1.6 1.6 0 0 1 0 2.2L11 18.5H7.2l-3-3a1.6 1.6 0 0 1 0-2.2z"></path><path d="M8.6 9.9l5.5 5.5"></path><path d="M11 18.5h9"></path></svg></span></span>
    </div>
    <div style="position:relative;display:grid;grid-template-columns:124px repeat(3,minmax(0,1fr));height:58px;border-bottom:1.5px solid var(--line2);margin-top:4px">
      <span style="display:flex;align-items:flex-end;padding:0 0 10px 16px;border-right:1px solid var(--line)"><span class="cap" style="font-size:10px">Spieler*innen</span></span>
      <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper2);border-right:1px solid var(--line)"><span class="wax" style="font-size:23px;line-height:1">JoJo</span><svg width="36" height="7" viewBox="0 0 40 7"><path class="hs" d="M3 4.5 C 13 1.5, 25 6, 37 2.5" stroke-width="2.8"></path></svg></span>
      <span style="display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)"><span class="wax" style="font-size:23px;line-height:1">Juli</span></span>
      <span style="display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--ink)"><span style="font-size:13px;color:var(--ink3);border-bottom:1.5px dashed var(--line2)">Name</span></span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="display:grid;grid-template-columns:124px repeat(3,minmax(0,1fr));height:44px;border-bottom:1px solid var(--line)">
        <span style="display:flex;align-items:center;padding-left:16px;font-size:14px;font-weight:500;border-right:1px solid var(--line)">{{r}}</span>
        <span style="background:var(--paper2);border-right:1px solid var(--line)"></span>
        <span style="border-right:1px solid var(--line)"></span>
        <span style="border-right:1px solid var(--line)"></span>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;top:0;right:0;bottom:0;background:var(--scrim)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="tn" style="position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px 34px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:center"><span style="width:38px;height:4px;border-radius:2px;background:var(--line2)"></span></div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span class="cap">Spalte 3</span>
        <h2 id="tn" style="margin:0;font-size:24px;font-weight:700">Wer spielt mit?</h2>
      </div>
      <a href="Main.dc.html" aria-label="Abbrechen" style="width:44px;height:44px;border-radius:22px;background:var(--paper2);display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" class="ic" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <span class="cap">Schon gespielt – antippen</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button disabled="" style="min-height:48px;padding:0 16px;border:0;border-radius:24px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:8px;opacity:.45"><span class="wax" style="font-size:26px;line-height:1">JoJo</span><span style="font-size:11px;color:var(--ink3)">Spalte 1</span></button>
      <button disabled="" style="min-height:48px;padding:0 16px;border:0;border-radius:24px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:8px;opacity:.45"><span class="wax" style="font-size:26px;line-height:1">Juli</span><span style="font-size:11px;color:var(--ink3)">Spalte 2</span></button>
      <a href="Main.dc.html" style="text-decoration:none;min-height:48px;padding:0 16px;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center"><span class="wax" style="font-size:26px;line-height:1">Vivi</span></a>
      <button style="min-height:48px;padding:0 16px 0 12px;border:0;border-radius:24px;background:var(--paper2);box-shadow:inset 0 0 0 2px var(--ink);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600">
        <svg width="16" height="16" viewBox="0 0 24 24" class="ic" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Neuer Name
      </button>
    </div>

    <label for="nm" class="cap" style="padding-top:4px">Name eintippen</label>
    <div style="display:flex;gap:10px;align-items:center;border-bottom:1.5px solid var(--ink);padding-bottom:6px">
      <input id="nm" type="text" autocomplete="off" maxlength="12" placeholder="z. B. Lena" style="flex:1;border:0;background:transparent;font-size:18px;min-height:44px;outline:none;padding:0">
      <a href="Main.dc.html" style="text-decoration:none;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:700;display:flex;align-items:center">Übernehmen</a>
    </div>
    <p style="margin:0;font-size:13px;line-height:1.45;color:var(--ink3)">Neue Namen landen automatisch in der Liste. Die Tastatur erscheint erst nach Tap auf „Neuer Name“.</p>
    <button style="align-self:flex-start;border:0;background:transparent;min-height:44px;padding:0;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:4px">Spalte entfernen</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stil":{"editor":"enum","options":["Grau · Wachs-Rot","Papier · Kuli-Blau","Beige · Buntstift-Orange"],"default":"Grau · Wachs-Rot"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.stil ?? 'Grau · Wachs-Rot';
    return {
      th: s.indexOf('Kuli') >= 0 ? 't-pen' : (s.indexOf('Buntstift') >= 0 ? 't-pencil' : 't-wax'),
      rows: ['1er', '2er', '3er', '4er', '5er', '6er', 'Bonus', 'Dreierpasch', 'Viererpasch', 'Full House']
    };
  }
}
</script>
</body>
</html>
